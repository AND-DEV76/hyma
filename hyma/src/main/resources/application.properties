spring.application.name=hyma

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyma_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hyma_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hyma_pass}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}