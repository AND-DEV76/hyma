server {
    listen 80;
    server_name hyma.online www.hyma.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hyma.online www.hyma.online;

    ssl_certificate /etc/letsencrypt/live/hyma.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyma.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://hyma_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
